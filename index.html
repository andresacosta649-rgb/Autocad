<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArchiSys · Sistema de Composición de Planos Arquitectónicos</title>
<meta name="description" content="Sistema automatizado para la organización y composición de planos arquitectónicos en AutoCAD">
<style>
  :root {
    --bg: #fafaf7;
    --bg-alt: #f2f0ea;
    --bg-dark: #1a1a1a;
    --text: #1a1a1a;
    --text-soft: #4a4a4a;
    --text-muted: #8a8a8a;
    --border: #e0ddd5;
    --accent: #c9a961;
    --accent-dark: #a8893f;
    --line: #1a1a1a;
    --shadow: 0 2px 20px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* Tipografía editorial */
  h1, h2, h3, h4 {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .mono {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 0.85em;
  }

  /* NAV */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(250, 250, 247, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    padding: 1rem 2rem;
  }

  .nav-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 500;
  }

  .nav-logo-mark {
    width: 32px;
    height: 32px;
    background: var(--line);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-soft);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--accent-dark); }

  /* HERO */
  .hero {
    min-height: 100vh;
    padding: 8rem 2rem 4rem;
    display: flex;
    align-items: center;
    position: relative;
    background: 
      linear-gradient(rgba(250,250,247,0.9), rgba(250,250,247,0.9)),
      repeating-linear-gradient(0deg, transparent, transparent 49px, var(--border) 49px, var(--border) 50px),
      repeating-linear-gradient(90deg, transparent, transparent 49px, var(--border) 49px, var(--border) 50px);
  }

  .hero-inner {
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  .hero-eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent-dark);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .hero-eyebrow::before {
    content: '';
    width: 40px;
    height: 1px;
    background: var(--accent-dark);
  }

  .hero h1 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    margin-bottom: 1.5rem;
    font-weight: 400;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--accent-dark);
  }

  .hero-desc {
    font-size: 1.1rem;
    color: var(--text-soft);
    margin-bottom: 2.5rem;
    max-width: 540px;
  }

  .hero-meta {
    display: flex;
    gap: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .hero-meta-item {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .hero-meta-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .hero-meta-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
  }

  .hero-visual {
    position: relative;
    aspect-ratio: 3/4;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .hero-visual::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px);
    opacity: 0.5;
  }

  .hero-visual-label {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    background: var(--bg);
    padding: 0.4rem 0.8rem;
  }

  .hero-visual-title {
    position: absolute;
    bottom: 2rem;
    left: 2rem;
    right: 2rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    line-height: 1.2;
  }

  .hero-visual-number {
    position: absolute;
    top: 2rem;
    right: 2rem;
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    color: var(--accent-dark);
    opacity: 0.3;
  }

  /* SECTIONS */
  section {
    padding: 6rem 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-header {
    margin-bottom: 4rem;
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 3rem;
    align-items: end;
  }

  .section-number {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent-dark);
    margin-bottom: 1rem;
    display: block;
  }

  .section-title {
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 400;
  }

  .section-title em {
    font-style: italic;
    color: var(--accent-dark);
  }

  .section-desc {
    font-size: 1.05rem;
    color: var(--text-soft);
    max-width: 600px;
  }

  /* RESUMEN */
  .resumen-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2rem;
    margin-bottom: 4rem;
  }

  .resumen-card {
    padding: 2rem 0;
    border-top: 1px solid var(--line);
  }

  .resumen-number {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 400;
    margin-bottom: 0.5rem;
    color: var(--accent-dark);
  }

  .resumen-label {
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.8rem;
  }

  .resumen-text {
    font-size: 0.95rem;
    color: var(--text-soft);
    line-height: 1.5;
  }

  /* PROCESO */
  .proceso-section {
    background: var(--bg-alt);
    padding: 6rem 2rem;
    margin: 0;
    max-width: none;
  }

  .proceso-inner {
    max-width: 1400px;
    margin: 0 auto;
  }

  .proceso-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .proceso-step {
    padding: 3rem 2rem;
    border-right: 1px solid var(--border);
    position: relative;
  }

  .proceso-step:last-child { border-right: none; }

  .proceso-step-num {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    color: var(--accent);
    opacity: 0.4;
    margin-bottom: 1rem;
    line-height: 1;
  }

  .proceso-step-title {
    font-size: 1.3rem;
    margin-bottom: 1rem;
    font-weight: 500;
  }

  .proceso-step-desc {
    font-size: 0.9rem;
    color: var(--text-soft);
    line-height: 1.6;
  }

  /* PLANOS - LA PARTE IMPORTANTE */
  .planos-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3rem;
    margin-bottom: 3rem;
  }

  .plano-card {
    cursor: pointer;
    transition: transform 0.3s;
  }

  .plano-card:hover { transform: translateY(-4px); }

  .plano-card.full {
    grid-column: 1 / -1;
  }

  .plano-image {
    aspect-ratio: 4/3;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .plano-image::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 29px, var(--border) 29px, var(--border) 30px),
      repeating-linear-gradient(90deg, transparent, transparent 29px, var(--border) 29px, var(--border) 30px);
    opacity: 0.4;
  }

  .plano-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: relative;
    z-index: 1;
  }

  .plano-placeholder {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
  }

  .plano-placeholder-icon {
    font-size: 3rem;
    color: var(--accent-dark);
    margin-bottom: 1rem;
    opacity: 0.6;
  }

  .plano-placeholder-text {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .plano-number {
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    color: var(--accent-dark);
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .plano-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    margin-bottom: 0.8rem;
    font-weight: 500;
  }

  .plano-desc {
    font-size: 0.95rem;
    color: var(--text-soft);
    margin-bottom: 1.2rem;
    line-height: 1.6;
  }

  .plano-specs {
    display: flex;
    gap: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .plano-spec {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .plano-spec-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .plano-spec-value {
    font-size: 0.9rem;
    color: var(--text);
    font-weight: 500;
  }

  .plano-zoom-hint {
    position: absolute;
    bottom: 1rem;
    right: 1rem;
    background: var(--bg);
    padding: 0.4rem 0.8rem;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    z-index: 2;
  }

  /* ANTES / DESPUÉS */
  .comparacion {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    margin-top: 3rem;
  }

  .comparacion-col {
    padding: 2.5rem;
    background: var(--bg-alt);
    border: 1px solid var(--border);
  }

  .comparacion-label {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .comparacion-label.antes { color: #b85c5c; }
  .comparacion-label.despues { color: #5c8b5c; }

  .comparacion-label::before {
    content: '';
    width: 24px;
    height: 1px;
    background: currentColor;
  }

  .comparacion-list {
    list-style: none;
  }

  .comparacion-list li {
    padding: 0.8rem 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
  }

  .comparacion-list li:last-child { border-bottom: none; }

  .comparacion-list .count {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--accent-dark);
  }

  /* ESPECIFICACIONES */
  .specs-section {
    background: var(--bg-dark);
    color: var(--bg);
    padding: 6rem 2rem;
    margin: 0;
    max-width: none;
  }

  .specs-inner {
    max-width: 1400px;
    margin: 0 auto;
  }

  .specs-section .section-number { color: var(--accent); }
  .specs-section .section-title em { color: var(--accent); }
  .specs-section .section-desc { color: #aaa; }

  .specs-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border-top: 1px solid #333;
    margin-top: 3rem;
  }

  .spec-item {
    padding: 2.5rem 2rem;
    border-right: 1px solid #333;
    border-bottom: 1px solid #333;
  }

  .spec-item:nth-child(3n) { border-right: none; }

  .spec-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 0.8rem;
  }

  .spec-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--accent);
  }

  /* SCRIPTS / ANEXOS */
  .scripts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
  }

  .script-card {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .script-header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .script-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
  }

  .script-lang {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-dark);
    background: var(--bg);
    padding: 0.3rem 0.8rem;
    border: 1px solid var(--border);
  }

  .script-code {
    padding: 1.5rem 2rem;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.7;
    color: var(--text-soft);
    max-height: 400px;
    overflow-y: auto;
    white-space: pre;
  }

  .script-footer {
    padding: 1rem 2rem;
    border-top: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .script-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .btn-copy {
    background: var(--line);
    color: var(--bg);
    border: none;
    padding: 0.5rem 1.2rem;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }

  .btn-copy:hover { background: var(--accent-dark); }

  /* FOOTER */
  footer {
    background: var(--bg-dark);
    color: #aaa;
    padding: 4rem 2rem 2rem;
  }

  .footer-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 4rem;
    padding-bottom: 3rem;
    border-bottom: 1px solid #333;
  }

  .footer-brand h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
